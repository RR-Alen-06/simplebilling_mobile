name: simplebilling_mobile
description: A native cross-platform Flutter application for SimpleBilling / PrintPro ERP.
publish_to: none

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^18.0.0
  supabase_flutter: ^2.17.2
  intl: ^0.20.3
  pdf: ^3.13.0
  printing: ^5.15.0
  shared_preferences: ^2.5.5
  fl_chart: ^1.2.0
  uuid: ^4.6.0
  state_notifier: ^1.0.0
  flutter_dotenv: ^6.0.1
  url_launcher: ^6.3.2
  mobile_scanner: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true